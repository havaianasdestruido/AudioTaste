<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album — AudioTaste</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">&#9835;</span> AudioTaste
      </a>
      <nav>
        <a href="../index.html" class="nav-link active">Albums</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <a class="detail-back" href="../index.html">&larr; All Albums</a>

    <div id="loading" class="loading">Loading album&hellip;</div>

    <div id="not-found" class="not-found hidden">
      <h1>Album not found</h1>
      <p>It may have been deleted or the link is incorrect.</p>
      <a class="btn btn-primary" href="../index.html">Back to Albums</a>
    </div>

    <section id="album-hero" class="album-hero hidden"></section>

    <h2 class="section-title hidden" id="reviews-title">Reviews</h2>

    <section class="review-form-card hidden" id="review-form-card">
      <form id="review-form" novalidate>
        <h3>Write a Review</h3>
        <div class="review-form">
          <label>Username
            <input type="text" id="r-username" maxlength="40" placeholder="e.g. User123" required>
          </label>
          <label>Rating (0.0 – 10.0)
            <input type="number" id="r-rating" min="0" max="10" step="0.1" placeholder="e.g. 9.0" required>
          </label>
          <label>Review
            <textarea id="r-text" rows="4" maxlength="2000" placeholder="What do you think of this album?" required></textarea>
          </label>
          <p id="review-form-error" class="form-error hidden"></p>
          <div class="submit-row">
            <button type="submit" id="submit-review-btn" class="btn btn-primary">Submit Review</button>
          </div>
        </div>
      </form>
    </section>

    <div id="reviews-list" class="reviews-list hidden"></div>

    <div id="no-reviews" class="empty-state hidden">
      <p>No reviews yet. Be the first to share your thoughts!</p>
    </div>

  </main>

  <!-- Edit Album modal -->
  <div id="edit-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>Edit Album</h2>
      <form id="edit-album-form" novalidate>
        <label>Album Title
          <input type="text" id="e-title" maxlength="200" required>
        </label>
        <label>Artist
          <input type="text" id="e-artist" maxlength="200" required>
        </label>
        <label>Release Year
          <input type="number" id="e-year" min="1900" max="2100" step="1">
        </label>
        <label>Genre
          <input type="text" id="e-genre" maxlength="60">
        </label>
        <label>Cover Image URL
          <input type="url" id="e-cover" placeholder="https://...">
        </label>
        <label>Description
          <textarea id="e-desc" rows="3" maxlength="1000"></textarea>
        </label>
        <p id="edit-form-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" id="cancel-edit-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="save-edit-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-root"></div>

  <script src="../config.js"></script>
  <script src="album.js"></script>
  <script type="module" src="../speed-insights.js"></script>
</body>
</html>
